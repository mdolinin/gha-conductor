version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    labels:
      - dependencies
    schedule:
      interval: daily
      time: "02:00"
    open-pull-requests-limit: 5
    ignore:
      # @types/node major must track the runtime major in .nvmrc / Dockerfile
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    labels:
      - dependencies
    schedule:
      interval: daily
      time: "02:00"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    labels:
      - dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    labels:
      - dependencies
    # Dependabot PRs must never cut a release: semantic-release releases on fix:/feat:, and Dependabot
    # otherwise copies the prefix style of recent commits on main (e.g. "fix:"). "build" + scope yields
    # "build(deps): ..." / "build(deps-dev): ...", which commit-analyzer does not release.
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    schedule:
      interval: daily
      time: "02:00"
    open-pull-requests-limit: 5
    ignore:
      # @types/node major must track the runtime major in .nvmrc / Dockerfile
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    labels:
      - dependencies
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: daily
      time: "02:00"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    labels:
      - dependencies
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
